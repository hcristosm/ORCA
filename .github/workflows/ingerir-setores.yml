name: Ingerir setores da CPRM/SGB

# Setor de risco geológico é resultado de levantamento de campo e muda em
# escala de meses. Rebaixar as 27 UFs todo dia gastava 14 minutos do job
# diário e, pior, expunha o dashboard inteiro à instabilidade da SGB: nos
# runs #23 e #29 isso derrubou 22 e 25 UFs, e o dashboard foi republicado
# quase vazio.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: ingerir-setores
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingerir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-python

      - name: Baixar setores já publicados
        id: baixar
        # Ingestão é incremental (marcador d'água em _where_incremental):
        # partir do estado anterior evita rebaixar tudo e, se a SGB falhar
        # numa UF, o dado do mês passado continua ali. Ausência da branch
        # não é erro -- a 1a execução parte do zero. Falha de rede, sim:
        # sem o estado anterior a guarda não tem contra o que comparar e
        # aprovaria apagar as UFs que já estavam em dados-base.
        uses: ./.github/actions/baixar-branch
        with:
          branch: dados-base
          destino: data
          ausente-e-fatal: "false"
          falha-e-fatal: "true"

      - name: Contar setores anteriores
        id: anterior
        # `find | wc -l` e não `ls data/*.gpkg | wc -l`: sob `pipefail` o
        # `ls` saindo 2 no glob vazio faria o `errexit` matar o passo antes
        # da contagem -- justamente no caso (data/ vazio) em que ela mais
        # importa. `find` não tem esse gatilho.
        shell: bash -eo pipefail {0}
        run: |
          mkdir -p data
          total=$(find data -maxdepth 1 -name '*.gpkg' | wc -l)
          echo "Setores anteriores: ${total} UF(s)."
          echo "total=${total}" >> "$GITHUB_OUTPUT"

      - name: Ingerir setores
        run: python -m src.cli ingerir-setores --diretorio data

      - name: Conferir tamanho dos GeoPackages
        # Contagem de arquivos não basta: 27 .gpkg de 0 byte ou truncados
        # também passariam em atual >= anterior. Limiar de 10 KiB: o menor
        # .gpkg real hoje em dados-base é risco_to.gpkg com ~108 KiB (a UF
        # com menos setores), então 10 KiB fica bem abaixo de qualquer
        # arquivo real e ainda pega vazio/truncado com folga.
        #
        # Recusa aqui zera a contagem atual passada à guarda, em vez de
        # gravar `publicar=false` por conta própria: uma única porta de
        # recusa (scripts/conferir_publicacao.py) é o que garante que as
        # duas propriedades da recusa valham em todos os caminhos.
        id: tamanho
        if: "!cancelled()"
        shell: bash -eo pipefail {0}
        run: |
          limiar_bytes=10240
          pequeno=""
          for f in data/*.gpkg; do
            [ -e "$f" ] || continue
            tamanho=$(stat -c%s "$f")
            if [ "$tamanho" -lt "$limiar_bytes" ]; then
              echo "::error::${f} tem ${tamanho} byte(s), abaixo do limiar de ${limiar_bytes} -- parece vazio ou truncado."
              pequeno="1"
            fi
          done
          if [ -n "$pequeno" ]; then
            echo "::error::Ao menos um .gpkg está vazio ou truncado; conjunto atual tratado como vazio."
            echo "atual=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "atual=$(find data -maxdepth 1 -name '*.gpkg' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Conferir antes de publicar
        id: conferir
        # Roda mesmo se "Ingerir setores" falhar (mas não se o job foi
        # cancelado): uma queda no meio da ingestão não pode nos impedir de
        # checar o que sobrou em data/. Publicação parcial é aceitável --
        # 20 UFs frescas valem mais que nenhuma -- mas publicar MENOS
        # significa destruir dado bom por uma falha no download ou na
        # ingestão, a mesma classe de incidente que este workflow existe
        # para evitar. Na dúvida, não publica.
        #
        # A lógica e as duas propriedades da recusa (grava `publicar=false`
        # ANTES de sair com 1; toda recusa sai com 1) vivem em
        # scripts/conferir_publicacao.py, compartilhado com
        # atualizar-dados.yml e coberto por tests/test_conferir_publicacao.py.
        if: "!cancelled()"
        run: >
          python3 scripts/conferir_publicacao.py
          --atual "${{ steps.tamanho.outputs.atual }}"
          --anterior "${{ steps.anterior.outputs.total }}"
          --rotulo "UF(s)"

      - name: Publicar em dados-base
        # !cancelled() (em vez de always()) porque uma execução parcial
        # ainda avançou as UFs que deram certo -- vale guardar mesmo com o
        # job marcado como falho, mas não se o job foi cancelado. A guarda
        # do passo "Conferir antes de publicar" também precisa passar:
        # publicar menos, ou pior, do que já estava em dados-base é perder
        # dado bom, então a publicação parcial é permitida, a regressão não.
        #
        # Sem force_orphan (ruling R-5): a spec define dados-base com
        # histórico (§4.4), justamente para permitir `git revert` se algo
        # passar pela guarda e ainda assim publicar algo ruim -- histórico
        # é a rede de segurança atrás da guarda, não redundante com ela.
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: data
          publish_branch: dados-base
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(dados-base): atualizar setores da CPRM/SGB"
