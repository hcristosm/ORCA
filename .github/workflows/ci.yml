name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # Cacheia o diretório do pip entre execuções. geopandas/shapely
          # trazem binários grandes e reinstalá-los do zero todo dia é o
          # passo mais lento do job. `cache-dependency-path` explícito
          # porque a chave sai do pyproject.toml (o projeto não tem
          # requirements.txt, que é o que o default procura primeiro).
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Checagem de tipos (mypy)
        run: mypy src scripts

      - name: Segurança (bandit)
        run: bandit -c pyproject.toml -r src scripts

      - name: Rodar testes
        run: pytest
