name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-python
        with:
          extras: dev

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Checagem de tipos (mypy)
        run: mypy src scripts

      - name: Segurança (bandit)
        run: bandit -c pyproject.toml -r src scripts

      - name: Rodar testes
        run: pytest
