name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest
