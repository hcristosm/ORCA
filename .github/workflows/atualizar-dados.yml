name: Atualizar dados do ORCA

on:
  schedule:
    # 09:00 UTC (06:00 em São Paulo) todo dia; CPRM/SGB e INMET raramente mudam
    # mais rápido que isso, e o pacote anual do INMET só é atualizado a cada
    # poucos dias.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs a atualizar, separadas por vírgula (vazio = todas as 27)"
        required: false
        default: ""
      ano:
        description: "Ano dos dados históricos do INMET"
        required: false
        default: "2026"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e .

      - name: Rodar atualização nacional
        run: >
          python scripts/atualizar_dados.py
          --ufs "${{ github.event.inputs.ufs || '' }}"
          --ano "${{ github.event.inputs.ano || '2026' }}"

      - name: Publicar dados como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dados-orca-nacional
          path: |
            data/*.gpkg
            data/*.csv
            data/ultima_atualizacao.txt
          retention-days: 14

      - name: Comitar dados exportados do dashboard estático
        # Uma UF que falhe faz o passo anterior sair com código != 0; sem
        # `always()` as demais UFs exportadas com sucesso seriam descartadas.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/data
          git diff --cached --quiet || git commit -m "chore(dashboard): atualizar dados exportados [skip ci]"
          git push
