name: Atualizar dados do ORCA

on:
  # A ingestão CPRM/SGB saiu do caminho diário (agora lê a branch dados-base),
  # então uma queda da SGB não afeta mais esta execução agendada.
  schedule:
    # 09:00 UTC (06:00 em São Paulo) todo dia; os setores de risco mudam em
    # escala de meses e a chuva da Open-Meteo é quase em tempo real, então
    # uma passada diária cobre as duas pontas.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs a atualizar, separadas por vírgula (vazio = todas as 27)"
        required: false
        default: ""

# Impede duas execuções (agendada + manual) rodando ao mesmo tempo: além de
# disputar cota de rate limit da Open-Meteo (observado em 22/08/2026), duas
# escritas concorrentes no arquivo de cache fariam a última a publicar
# apagar silenciosamente o progresso da outra.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-python

      - name: Baixar setores da branch dados-base
        # Diferente do cache da Open-Meteo, que é só um empurrão inicial, os
        # setores são obrigatórios: sem eles a exportação não tem o que
        # cruzar e o dashboard sai vazio. Por isso os dois casos são fatais.
        uses: ./.github/actions/baixar-branch
        with:
          branch: dados-base
          destino: data
          ausente-e-fatal: "true"
          falha-e-fatal: "true"
          mensagem-ausente: "Rode o workflow ingerir-setores.yml antes."

      - name: Conferir setores baixados
        # `find | wc -l` e não `ls data/*.gpkg | wc -l`: sob `pipefail` o glob
        # sem correspondência faz o `ls` sair 2, o pipeline herda 2 e o
        # `errexit` mataria o passo ANTES do `if` -- deixando o operador sem
        # a anotação ::error:: que explica o quê.
        shell: bash -eo pipefail {0}
        run: |
          TOTAL=$(find data -maxdepth 1 -name '*.gpkg' | wc -l)
          echo "Setores carregados: $TOTAL UF(s)."
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Nenhum GeoPackage em dados-base."
            exit 1
          fi

      - name: Buscar branch gh-pages
        id: ghpages
        # Nada aqui é fatal: o cache publicado é só um empurrão inicial e, se
        # não vier, a atualização nacional reconstrói do zero. Mas `motivo`
        # importa para o passo seguinte -- "ausente" é legitimamente zero
        # (1a publicação), "falha" é indeterminado.
        uses: ./.github/actions/baixar-branch
        with:
          branch: gh-pages
          ausente-e-fatal: "false"
          falha-e-fatal: "false"

      - name: Ler cache e contagem já publicados
        id: publicado
        # O cache é opcional: ausente ou corrompido vira cache vazio
        # (src/storage_cache_openmeteo.py trata os dois casos), e a execução
        # degrada para uma reconstrução fria, que é segura.
        #
        # A contagem publicada NÃO é opcional: é o insumo da guarda
        # anti-regressão. Se não conseguirmos lê-la, `publicado` sai vazio e
        # a guarda recusa (falha fechada). SÓ "branch gh-pages não existe"
        # vira legitimamente 0 -- é a 1a publicação e não há nada a destruir.
        # Branch presente sem `data/ufs_disponiveis.json` NÃO é 0: é estado
        # indeterminado, e tratá-lo como 0 deixaria passar um conjunto de 1
        # UF por cima do que quer que esteja publicado.
        shell: bash -eo pipefail {0}
        env:
          DISPONIVEL: ${{ steps.ghpages.outputs.disponivel }}
          MOTIVO: ${{ steps.ghpages.outputs.motivo }}
        run: |
          mkdir -p data/cache
          publicado=""

          if [ "$DISPONIVEL" != "true" ]; then
            if [ "$MOTIVO" = "ausente" ]; then
              echo "1a publicação; nada no ar a preservar."
              publicado=0
            else
              echo "gh-pages indisponível por falha de rede/git; contagem publicada indeterminada -- a guarda vai recusar a publicação."
            fi
            echo "publicado=${publicado}" >> "$GITHUB_OUTPUT"
            exit 0
          fi


          if git show origin/gh-pages:cache/openmeteo.sqlite > data/cache/openmeteo.sqlite 2>/dev/null; then
            echo "Cache publicado baixado com sucesso."
          else
            # O redirecionamento cria o arquivo mesmo quando `git show` falha;
            # remove pra não publicar um sqlite de 0 byte.
            rm -f data/cache/openmeteo.sqlite
            echo "gh-pages existe mas ainda não tem cache publicado; seguindo com cache vazio."
          fi

          if git show origin/gh-pages:data/ufs_disponiveis.json > ufs_publicadas.json 2>/dev/null; then
            echo "Índice publicado baixado."
          else
            rm -f ufs_publicadas.json
            echo "gh-pages existe mas não tem data/ufs_disponiveis.json -- estado publicado indeterminado; a guarda vai recusar em vez de autorizar sobrescrever no escuro."
          fi
          echo "publicado=" >> "$GITHUB_OUTPUT"

      - name: Rodar atualização nacional
        run: >
          python -m src.cli atualizar-nacional
          ${{ github.event.inputs.ufs && format('--ufs {0}', github.event.inputs.ufs) || '' }}

      - name: Preservar UFs não regeneradas (mescla com o gh-pages)
        # Spec §4.5. Com force_orphan, o gh-pages vira EXATAMENTE
        # docs/dashboard: uma UF que a Open-Meteo não entregou hoje sumiria
        # do ar. E como a cobertura diária oscila entre 70% e 100% (18 runs,
        # 2026-08-10 a 08-23), sumir seria o caso comum -- a guarda
        # anti-regressão abaixo viraria uma catraca travada no melhor dia já
        # publicado, recusando cerca de um terço das execuções e congelando o
        # dashboard. Completando o conjunto com o que já está publicado,
        # degradar passa a ser envelhecer, e a guarda volta a significar
        # "algo está errado" em vez de "hoje a Open-Meteo oscilou".
        #
        # `!cancelled()` para mesclar mesmo depois de uma exportação
        # parcialmente falha -- é justamente aí que a mescla serve. Mas o
        # script recusa (sai 1) quando este run não gerou índice nenhum: aí a
        # mescla produziria um conjunto artificialmente completo, feito só de
        # dado velho, e a guarda o aprovaria como se fosse novo. Sem índice,
        # o conjunto atual continua vazio e a guarda recusa, que é o certo.
        #
        # Reaproveita o `origin/gh-pages` já buscado acima: sem ele (1a
        # publicação, ou fetch que falhou) não há nada a preservar.
        shell: bash -eo pipefail {0}
        if: "!cancelled()"
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/gh-pages > /dev/null; then
            echo "gh-pages não disponível localmente (1a publicação ou fetch falhou); nada a preservar."
            exit 0
          fi
          publicado_dir=$(mktemp -d)
          # `git archive` falha se o caminho não existir na árvore (gh-pages
          # sem data/); e sem o pipefail acima o tar sairia 0 com entrada
          # vazia, escondendo isso. stderr silenciado porque esse caso é
          # normal e esperado: três linhas de `fatal:`/`tar:` num passo que
          # fecha verde ensinam o operador a ignorar log.
          if ! git archive origin/gh-pages data 2>/dev/null | tar -x -C "$publicado_dir" 2>/dev/null; then
            echo "gh-pages não tem data/ publicado; nada a preservar."
            exit 0
          fi
          python3 scripts/mesclar_publicado.py \
            --publicado "$publicado_dir/data" \
            --atual docs/dashboard/data \
            --escopo data

      - name: Conferir antes de publicar
        id: conferir
        # Invariante da spec: nenhuma publicação destrói dado bom. O deploy
        # usa force_orphan, então o gh-pages passa a ser EXATAMENTE o
        # conteúdo de docs/dashboard -- publicar com data/ vazio apaga as 27
        # UFs e o cache publicado de quebra. Foi assim que o run #29 destruiu
        # 25 UFs de forma irrecuperável.
        #
        # `!cancelled()` em vez de `always()` para que a conferência rode
        # mesmo com passo anterior falho (publicação parcial vale a pena),
        # mas não num job cancelado.
        #
        # A lógica e as duas propriedades da recusa (grava `publicar=false`
        # ANTES de sair com 1; toda recusa sai com 1) vivem em
        # scripts/conferir_publicacao.py, compartilhado com
        # ingerir-setores.yml e coberto por tests/test_conferir_publicacao.py.
        if: "!cancelled()"
        shell: bash -eo pipefail {0}
        env:
          PUBLICADO: ${{ steps.publicado.outputs.publicado }}
        run: |
          # O índice publicado é a fonte preferida; sem o arquivo, cai para
          # a contagem do passo anterior (0 na 1a publicação, vazia -- e
          # portanto recusada -- quando o estado no ar é indeterminado).
          if [ -f ufs_publicadas.json ]; then
            anterior=(--anterior-json ufs_publicadas.json)
          else
            anterior=(--anterior "$PUBLICADO")
          fi
          python3 scripts/conferir_publicacao.py \
            --atual-json docs/dashboard/data/ufs_disponiveis.json \
            "${anterior[@]}" \
            --rotulo "UF(s)"

      - name: Preparar cache para publicação
        # `peaceiris/actions-gh-pages` com force_orphan publica só o que
        # estiver dentro de publish_dir no momento do deploy; o cache precisa
        # estar copiado pra lá pra sobreviver ao próximo run. Publica o que
        # existir em data/cache/openmeteo.sqlite neste ponto, sem se importar
        # se veio do download do início do job ou foi reconstruído do zero
        # (ambos produzem um cache válido; não publicar o reconstruído só
        # pioraria as coisas, deixando o gh-pages sem cache nenhum). Só não
        # publica acima de 80MB (o GitHub rejeita push acima de 100MB; melhor
        # publicar sem cache do que quebrar o deploy do dashboard inteiro).
        #
        # Grava também o marcador `versao.txt` com o id deste run: é o que o
        # teste de fumaça pós-deploy procura na URL pública para saber que o
        # que está no ar é ESTE deploy, e não o de ontem (que também tem 27 UFs).
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        run: |
          echo "$GITHUB_RUN_ID" > docs/dashboard/versao.txt
          mkdir -p docs/dashboard/cache
          if [ -f data/cache/openmeteo.sqlite ]; then
            cp data/cache/openmeteo.sqlite docs/dashboard/cache/openmeteo.sqlite
            TAMANHO=$(stat -c%s docs/dashboard/cache/openmeteo.sqlite)
            LIMITE=$((80 * 1024 * 1024))
            if [ "$TAMANHO" -gt "$LIMITE" ]; then
              echo "Cache maior que 80MB ($TAMANHO bytes); não publicando pra evitar falha no push do gh-pages." >&2
              rm -f docs/dashboard/cache/openmeteo.sqlite
            fi
          fi

      - name: Publicar dashboard no GitHub Pages
        # `always()` aqui era o defeito do run #29: com force_orphan, publicar
        # depois de uma falha reescreve o gh-pages com o que sobrou (às vezes
        # nada). `!cancelled()` mantém a publicação parcial útil, e a guarda
        # de "Conferir antes de publicar" barra o conjunto vazio ou menor que
        # o que já está no ar.
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/dashboard
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(dashboard): publicar dados atualizados"

      - name: Conferir dashboard no ar (teste de fumaça)
        # A guarda protege ANTES de publicar; nada conferia DEPOIS se a URL
        # pública serve mesmo o que foi publicado. O push no gh-pages só vira
        # site depois do build do Pages (legacy, fora deste job), então espera
        # o `versao.txt` deste run aparecer -- até ~10 min -- e só então compara
        # a contagem de UFs no ar com a que acabou de ser publicada.
        #
        # `?t=` fura o cache do CDN (max-age=600): sem ele, o teste leria a
        # versão de ontem e passaria sem provar nada.
        #
        # Falhar aqui não desfaz nada (force_orphan não tem histórico), mas deixa
        # o run vermelho: "publicou e o site não mostra" não pode fechar verde.
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        shell: bash -eo pipefail {0}
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          contar='import json,sys; print(len(json.load(sys.stdin)))'
          esperado=$(python3 -c "$contar" < docs/dashboard/data/ufs_disponiveis.json)

          for tentativa in $(seq 1 40); do
            versao=$(curl -fsS "${url}versao.txt?t=${GITHUB_RUN_ID}-${tentativa}" 2>/dev/null || true)
            if [ "$versao" = "$GITHUB_RUN_ID" ]; then
              no_ar=$(curl -fsS "${url}data/ufs_disponiveis.json?t=${GITHUB_RUN_ID}-${tentativa}" | python3 -c "$contar") || no_ar=""
              curl -fsS -o /dev/null "${url}?t=${GITHUB_RUN_ID}" || { echo "::error::Deploy no ar, mas ${url} não responde 200."; exit 1; }
              if [ "$no_ar" != "$esperado" ]; then
                echo "::error::Deploy no ar, mas a URL pública serve ${no_ar:-índice ilegível} UF(s); o publicado foram ${esperado}."
                exit 1
              fi
              echo "Dashboard no ar com o deploy deste run: ${no_ar} UF(s) em ${url}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Após ~10 min a URL pública ainda não serve o deploy deste run (versao.txt='${versao:-ausente}', esperado ${GITHUB_RUN_ID}). O build do Pages pode ter falhado -- confira a aba Actions > pages build and deployment."
          exit 1
