name: Atualizar dados do ORCA

on:
  # Os setores vêm prontos da publicação v1 do BELUGA, que coleta e valida as
  # fontes (CPRM/SGB inclusive) num ritmo próprio: uma queda da SGB não afeta
  # esta execução agendada, e o pior caso aqui é o BELUGA não ter publicado
  # nada de novo.
  schedule:
    # 09:00 UTC (06:00 em São Paulo) todo dia; os setores de risco mudam em
    # escala de meses e a chuva da Open-Meteo é quase em tempo real, então
    # uma passada diária cobre as duas pontas.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs a atualizar, separadas por vírgula (vazio = todas as 27)"
        required: false
        default: ""
      aceitar_reducao:
        description: "A fonte reduziu de propósito: aceitar UF com menos setores (confira UMA a UMA antes)"
        type: boolean
        required: false
        default: false

# Impede duas execuções (agendada + manual) rodando ao mesmo tempo: além de
# disputar cota de rate limit da Open-Meteo (observado em 22/08/2026), duas
# escritas concorrentes no arquivo de cache fariam a última a publicar
# apagar silenciosamente o progresso da outra.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: write
  # Só para o passo de limpeza do histórico de deployments do Pages, no fim.
  deployments: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-python

      - name: Restaurar o cache da Open-Meteo
        # Antes o cache viajava dentro do gh-pages (era por isso que o deploy
        # precisava de force_orphan). Aqui ele é estado de CI, não conteúdo do
        # site: a chave tem o id do run, então nunca dá hit exato, e
        # `restore-keys` restaura o cache mais recente do prefixo. Cache
        # ausente degrada para uma reconstrução fria, que é segura.
        #
        # `restore` e `save` separados, e não o `actions/cache` de um passo só:
        # aquele grava num passo post com `post-if: success()`, então o cache
        # seria descartado exatamente no dia em que uma UF falha e o job fecha
        # vermelho -- e o run seguinte reconstruiria frio, contra a cota
        # diária. Status de job não decide nada aqui, pela mesma regra da casa
        # que manda não julgar um run pelo status.
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: openmeteo-${{ github.run_id }}
          restore-keys: |
            openmeteo-

      - name: Buscar branch gh-pages
        id: ghpages
        # Nada aqui é fatal, porque quem recusa é a guarda: sem o gh-pages a
        # contagem publicada fica indeterminada e a publicação é barrada mais
        # adiante. Mas `motivo` importa para o passo seguinte -- "ausente" é
        # legitimamente zero (1a publicação), "falha" é indeterminado.
        uses: ./.github/actions/baixar-branch
        with:
          branch: gh-pages
          ausente-e-fatal: "false"
          falha-e-fatal: "false"

      - name: Ler contagem publicada e extrair o publicado
        id: publicado
        # A contagem publicada é o insumo da guarda anti-regressão. Se não
        # conseguirmos lê-la, `publicado` sai vazio e a guarda recusa (falha
        # fechada). SÓ "branch gh-pages não existe" vira legitimamente 0 -- é a
        # 1a publicação e não há nada a destruir. Branch presente sem
        # `data/ufs_disponiveis.json` NÃO é 0: é estado indeterminado, e
        # tratá-lo como 0 deixaria passar um conjunto de 1 UF por cima do que
        # quer que esteja publicado.
        #
        # A árvore publicada é extraída UMA vez aqui, em `publicado/data`, e
        # serve a dois passos: o piso por UF do download do BELUGA e a mescla
        # que preserva as UFs não regeneradas.
        shell: bash -eo pipefail {0}
        env:
          DISPONIVEL: ${{ steps.ghpages.outputs.disponivel }}
          MOTIVO: ${{ steps.ghpages.outputs.motivo }}
        run: |
          publicado=""

          if [ "$DISPONIVEL" != "true" ]; then
            if [ "$MOTIVO" = "ausente" ]; then
              echo "1a publicação; nada no ar a preservar."
              publicado=0
            else
              echo "gh-pages indisponível por falha de rede/git; contagem publicada indeterminada -- a guarda vai recusar a publicação."
            fi
            echo "publicado=${publicado}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show origin/gh-pages:data/ufs_disponiveis.json > ufs_publicadas.json 2>/dev/null; then
            echo "Índice publicado baixado."
          else
            rm -f ufs_publicadas.json
            echo "gh-pages existe mas não tem data/ufs_disponiveis.json -- estado publicado indeterminado; a guarda vai recusar em vez de autorizar sobrescrever no escuro."
          fi

          mkdir -p publicado
          # `git archive` falha se o caminho não existir na árvore (gh-pages
          # sem data/); e sem o pipefail acima o tar sairia 0 com entrada
          # vazia, escondendo isso. stderr silenciado porque esse caso é
          # normal e esperado: três linhas de `fatal:`/`tar:` num passo que
          # fecha verde ensinam o operador a ignorar log.
          if git archive origin/gh-pages data 2>/dev/null | tar -x -C publicado 2>/dev/null; then
            echo "Publicado extraído em publicado/data."
            find publicado/data -maxdepth 1 -name 'meta_*.json' | wc -l | xargs echo "Metas publicados:"
          else
            echo "gh-pages existe mas não tem data/ publicado; sem piso por UF e sem nada a preservar."
          fi
          echo "publicado=" >> "$GITHUB_OUTPUT"

      - name: Baixar setores do BELUGA
        # Antes vinha da branch dados-base, ingerida da CPRM/SGB por um
        # workflow mensal próprio. Agora vem da publicação v1 do BELUGA, com
        # conferência de contrato, de sha256 e da contagem de feições de cada
        # UF, mais o piso contra os setores já publicados aqui.
        #
        # UF que falha fica com o dado anterior e o comando sai com 1,
        # dizendo por quê: setor congelado em silêncio é o jeito de a coleta
        # parar por meses sem ninguém ver, então o run TEM de ficar vermelho.
        #
        # Mas vermelho não é motivo para congelar as outras 26. Diferente da
        # branch dados-base, que vinha inteira ou não vinha, aqui a falha é
        # por UF, e `exportar_nacional` pula UF sem GeoPackage sem
        # interromper as demais. Por isso os dois passos seguintes rodam com
        # `!cancelled()`: um sha256 que não bate em RR não pode deixar SP sem
        # a chuva de hoje. Quem barra a publicação vazia continua sendo a
        # guarda de "Conferir antes de publicar".
        #
        # `aceitar_reducao` tira SÓ este piso, SÓ num disparo manual, e fica
        # no log do run para sempre. Existe porque "a fonte encolheu de
        # propósito" é um estado real e sem saída: quando a SGB remapeia um
        # município e publica menos setores que antes, o piso recusa aquela UF
        # todo dia, para sempre, e o ORCA fica com dado que a própria fonte já
        # apagou. Foi o caso de SC em 2026-11 (Nova Trento, 31 setores sem
        # data viraram 23 datados).
        #
        # Quem liga isto tem de ter conferido a diferença UF a UF, código a
        # código, contra a fonte. É botão de uma vez, não de todo dia, e o
        # padrão é desligado. As outras conferências do download (contrato, as
        # 27 UFs, sha256, contagem de feições declarada) continuam valendo, e
        # a guarda de publicação e o piso de cobertura da mescla também: esta
        # chave não os alcança.
        run: >
          python -m src.cli baixar-beluga
          ${{ github.event.inputs.ufs && format('--ufs {0}', github.event.inputs.ufs) || '' }}
          --diretorio data
          ${{ github.event.inputs.aceitar_reducao == 'true' && ' ' || '--publicado publicado/data' }}

      - name: Conferir setores baixados
        # `find | wc -l` e não `ls data/*.gpkg | wc -l`: sob `pipefail` o glob
        # sem correspondência faz o `ls` sair 2, o pipeline herda 2 e o
        # `errexit` mataria o passo ANTES do `if` -- deixando o operador sem
        # a anotação ::error:: que explica o quê.
        if: "!cancelled()"
        shell: bash -eo pipefail {0}
        run: |
          TOTAL=$(find data -maxdepth 1 -name 'beluga_*.gpkg' | wc -l)
          echo "Setores carregados: $TOTAL UF(s)."
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Nenhum GeoPackage do BELUGA em data/."
            exit 1
          fi

      - name: Rodar atualização nacional
        if: "!cancelled()"
        run: >
          python -m src.cli atualizar-nacional
          ${{ github.event.inputs.ufs && format('--ufs {0}', github.event.inputs.ufs) || '' }}

      - name: Guardar o cache da Open-Meteo
        # Depois da exportação e fora do passo post: a chuva buscada hoje vale
        # para o run de amanhã mesmo que a publicação de hoje seja recusada.
        if: "!cancelled()"
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: openmeteo-${{ github.run_id }}

      - name: Preservar UFs não regeneradas (mescla com o gh-pages)
        # Spec §4.5. O deploy sobrescreve o destino com o conteúdo de
        # docs/dashboard, então uma UF que a Open-Meteo não entregou hoje
        # sumiria do ar. E como a cobertura diária oscila entre 70% e 100% (18 runs,
        # 2026-08-10 a 08-23), sumir seria o caso comum -- a guarda
        # anti-regressão abaixo viraria uma catraca travada no melhor dia já
        # publicado, recusando cerca de um terço das execuções e congelando o
        # dashboard. Completando o conjunto com o que já está publicado,
        # degradar passa a ser envelhecer, e a guarda volta a significar
        # "algo está errado" em vez de "hoje a Open-Meteo oscilou".
        #
        # `!cancelled()` para mesclar mesmo depois de uma exportação
        # parcialmente falha -- é justamente aí que a mescla serve. Mas o
        # script recusa (sai 1) quando este run não gerou índice nenhum: aí a
        # mescla produziria um conjunto artificialmente completo, feito só de
        # dado velho, e a guarda o aprovaria como se fosse novo. Sem índice,
        # o conjunto atual continua vazio e a guarda recusa, que é o certo.
        #
        # Reaproveita a árvore publicada extraída em `publicado/data`: sem ela
        # (1a publicação, ou fetch que falhou) não há nada a preservar.
        shell: bash -eo pipefail {0}
        if: "!cancelled()"
        env:
          # Vazio no cron (todas as UFs); no dispatch, o piso mede contra as pedidas.
          UFS_PEDIDAS: ${{ github.event.inputs.ufs }}
        run: |
          if [ ! -d publicado/data ]; then
            echo "Sem publicado/data (1a publicação, fetch falhou ou gh-pages sem data/); nada a preservar."
            exit 0
          fi
          python3 scripts/mesclar_publicado.py \
            --publicado publicado/data \
            --atual docs/dashboard/data \
            --escopo data \
            --pedidas "$UFS_PEDIDAS"

      - name: Gerar índice de setores ("Perto de mim")
        # Índice nacional leve (setores_pontos.json) para a tela do celular.
        # Roda DEPOIS da mescla para cobrir também as UFs preservadas da véspera.
        # Falhar aqui não pode impedir a publicação: o front trata índice ausente,
        # e o `continue-on-error` deixa a falha visível no run sem bloquear nada.
        # Não toca em ufs_disponiveis.json nem na guarda abaixo.
        if: "!cancelled()"
        continue-on-error: true
        run: python -m src.cli indexar-setores --dados docs/dashboard/data

      - name: Conferir antes de publicar
        id: conferir
        # Invariante da spec: nenhuma publicação destrói dado bom. O deploy
        # apaga do destino o que não está em docs/dashboard, então publicar
        # com data/ vazio apaga as 27 UFs. Foi assim que o run #29 destruiu 25
        # UFs de forma irrecuperável.
        #
        # `!cancelled()` em vez de `always()` para que a conferência rode
        # mesmo com passo anterior falho (publicação parcial vale a pena),
        # mas não num job cancelado.
        #
        # A lógica e as duas propriedades da recusa (grava `publicar=false`
        # ANTES de sair com 1; toda recusa sai com 1) vivem em
        # scripts/conferir_publicacao.py, coberto por
        # tests/test_conferir_publicacao.py.
        if: "!cancelled()"
        shell: bash -eo pipefail {0}
        env:
          PUBLICADO: ${{ steps.publicado.outputs.publicado }}
        run: |
          # O índice publicado é a fonte preferida; sem o arquivo, cai para
          # a contagem do passo anterior (0 na 1a publicação, vazia -- e
          # portanto recusada -- quando o estado no ar é indeterminado).
          if [ -f ufs_publicadas.json ]; then
            anterior=(--anterior-json ufs_publicadas.json)
          else
            anterior=(--anterior "$PUBLICADO")
          fi
          python3 scripts/conferir_publicacao.py \
            --atual-json docs/dashboard/data/ufs_disponiveis.json \
            "${anterior[@]}" \
            --rotulo "UF(s)"

      - name: Marcar a versão publicada
        # Grava o marcador `versao.txt` com o id deste run: é o que o teste de
        # fumaça pós-deploy procura na URL pública para saber que o que está no
        # ar é ESTE deploy, e não o de ontem (que também tem 27 UFs).
        #
        # O cache da Open-Meteo não é mais copiado para cá: ele vive em
        # actions/cache. O `cache/openmeteo.sqlite` que ficou publicado na
        # última versão do gh-pages sai do ar no próximo deploy, porque o
        # deploy não usa `keep_files` e apaga do destino o que não está em
        # publish_dir.
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        run: echo "$GITHUB_RUN_ID" > docs/dashboard/versao.txt

      - name: Publicar dashboard no GitHub Pages
        # `always()` aqui era o defeito do run #29: publicar depois de uma
        # falha reescreve o gh-pages com o que sobrou (às vezes nada).
        # `!cancelled()` mantém a publicação parcial útil, e a guarda de
        # "Conferir antes de publicar" barra o conjunto vazio ou menor que o
        # que já está no ar.
        #
        # `force_orphan` fica. O que o cache da Open-Meteo dentro do
        # publish_dir obrigava era publicar 68 MB de sqlite junto com o site, e
        # isso acabou: o cache agora é estado de CI. Mas o `gh-pages` continua
        # sendo artefato de build, não história de ninguém, e sem `force_orphan`
        # ele cresce 6,9 MB por publicação (medido: 78 MB de dados que se
        # reescrevem todo dia), o que dá cerca de 2,5 GB por ano num
        # repositório de 90 MB. O que se compraria com isso seria `git revert`
        # numa publicação ruim, e para isso já existe caminho melhor: rodar o
        # workflow de novo, que é idempotente. Pagar 2,5 GB por ano por um
        # caminho de reversão que ninguém usaria não é simplicidade.
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/dashboard
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(dashboard): publicar dados atualizados"

      - name: Conferir dashboard no ar (teste de fumaça)
        # A guarda protege ANTES de publicar; nada conferia DEPOIS se a URL
        # pública serve mesmo o que foi publicado. O push no gh-pages só vira
        # site depois do build do Pages (legacy, fora deste job), então espera
        # o `versao.txt` deste run aparecer -- até ~10 min -- e só então compara
        # a contagem de UFs no ar com a que acabou de ser publicada.
        #
        # `?t=` fura o cache do CDN (max-age=600): sem ele, o teste leria a
        # versão de ontem e passaria sem provar nada.
        #
        # Falhar aqui não desfaz nada (o gh-pages não tem histórico), mas deixa
        # o run vermelho: "publicou e o site não mostra" não pode fechar verde.
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        shell: bash -eo pipefail {0}
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          contar='import json,sys; print(len(json.load(sys.stdin)))'
          esperado=$(python3 -c "$contar" < docs/dashboard/data/ufs_disponiveis.json)

          for tentativa in $(seq 1 40); do
            versao=$(curl -fsS "${url}versao.txt?t=${GITHUB_RUN_ID}-${tentativa}" 2>/dev/null || true)
            if [ "$versao" = "$GITHUB_RUN_ID" ]; then
              no_ar=$(curl -fsS "${url}data/ufs_disponiveis.json?t=${GITHUB_RUN_ID}-${tentativa}" | python3 -c "$contar") || no_ar=""
              curl -fsS -o /dev/null "${url}?t=${GITHUB_RUN_ID}" || { echo "::error::Deploy no ar, mas ${url} não responde 200."; exit 1; }
              if [ "$no_ar" != "$esperado" ]; then
                echo "::error::Deploy no ar, mas a URL pública serve ${no_ar:-índice ilegível} UF(s); o publicado foram ${esperado}."
                exit 1
              fi
              echo "Dashboard no ar com o deploy deste run: ${no_ar} UF(s) em ${url}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Após ~10 min a URL pública ainda não serve o deploy deste run (versao.txt='${versao:-ausente}', esperado ${GITHUB_RUN_ID}). O build do Pages pode ter falhado -- confira a aba Actions > pages build and deployment."
          exit 1

      - name: Limpar deployments antigos do Pages
        # O environment `github-pages` ganha uma entrada por publicação e a
        # lista da página do repo só cresce (eram 127). Mantém o deployment
        # mais recente e apaga o resto; a API exige marcar `inactive` antes do
        # DELETE, porque o Pages deixa os anteriores em `success`.
        #
        # Roda DEPOIS do teste de fumaça de propósito: o deployment deste run é
        # criado pelo "pages build and deployment", que é assíncrono, e o teste
        # acima só passa quando esse build já publicou -- então aqui o mais
        # recente é o deste run.
        #
        # `continue-on-error` porque isto é cosmético: o site mora na branch
        # `gh-pages` e não depende deste histórico. Ao contrário da guarda de
        # publicação, que falha alto de propósito, uma limpeza que falhe não
        # pode derrubar o cron diário -- ela avisa e segue.
        if: "!cancelled() && steps.conferir.outputs.publicar == 'true'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -uo pipefail {0}
        run: |
          manter=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=1" --jq '.[0].id')
          if [ -z "$manter" ]; then
            echo "::warning::Nenhum deployment listado; nada a limpar."
            exit 0
          fi
          echo "Mantendo o deployment ${manter}."

          apagados=0
          while :; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100" --jq '.[].id' | grep -v "^${manter}$" || true)
            [ -z "$ids" ] && break
            for id in $ids; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" -f state=inactive >/dev/null 2>&1
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}" >/dev/null 2>&1; then
                apagados=$((apagados+1))
              else
                echo "::warning::Não apagou o deployment ${id}."
              fi
            done
          done
          echo "Deployments antigos apagados: ${apagados}."
