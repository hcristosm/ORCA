name: Atualizar dados do ORCA

on:
  schedule:
    # 09:00 UTC (06:00 em São Paulo) todo dia; CPRM/SGB e INMET raramente mudam
    # mais rápido que isso, e o pacote anual do INMET só é atualizado a cada
    # poucos dias.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs a atualizar, separadas por vírgula (vazio = todas as 27)"
        required: false
        default: ""
      ano:
        description: "Ano dos dados históricos do INMET"
        required: false
        default: "2026"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e .

      - name: Rodar atualização nacional
        run: >
          python scripts/atualizar_dados.py
          --ufs "${{ github.event.inputs.ufs || '' }}"
          --ano "${{ github.event.inputs.ano || '2026' }}"

      - name: Publicar dados como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dados-orca-nacional
          path: |
            data/*.gpkg
            data/*.csv
            data/ultima_atualizacao.txt
          retention-days: 14

      - name: Publicar dashboard no GitHub Pages
        # Uma UF que falhe faz o passo anterior sair com código != 0; sem
        # `always()` as demais UFs exportadas com sucesso seriam descartadas.
        # `force_orphan: true` reseta a branch gh-pages a cada deploy (um
        # único commit), em vez de acumular histórico como fazíamos antes
        # commitando os dados na main.
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/dashboard
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(dashboard): publicar dados atualizados"
