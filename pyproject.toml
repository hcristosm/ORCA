[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "1.0.0"
description = "Dashboard estático que cruza setorização de risco geológico (CPRM/SGB) com chuva recente (INMET/ANA)"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "requests>=2.34.2",
    "typer>=0.27.1",
    "defusedxml>=0.7.1",
]

[project.scripts]
orca = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.2",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "bandit>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008", # typer.Option(...) in argument defaults is the required typer pattern
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
