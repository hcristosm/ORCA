[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "2.2.0"
description = "Dashboard estático que cruza setorização de risco geológico (CPRM/SGB) com chuva recente (Open-Meteo)"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "geopandas>=1.2.0",
    "shapely>=2.2.0",
    "requests>=2.34.2",
    "typer>=0.27.3",
]

[project.scripts]
orca = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008", # typer.Option(...) in argument defaults is the required typer pattern
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
