[project]
name = "orca"
version = "0.3.0"
description = "Dashboard estático que cruza setorização de risco geológico (CPRM/SGB) com chuva recente (INMET/ANA)"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "requests>=2.34.2",
    "typer>=0.27.1",
]

[project.scripts]
orca = "src.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
